<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Hearthvale Reel Compositor</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/*
 * Hearthvale motion reel — compositor. Pure function of time: renderFrame(i) draws frame i
 * (60 fps) from the captured in-engine plates plus all motion graphics. Deterministic.
 */
const W = 1920, H = 1080, FPS = 60, DUR = 30;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---- palette / type -----------------------------------------------------------------------
const INK = '#140d08', CREAM = '#fff3dc', GOLD = '#f6b94a', EMBER = '#ff8a3d', DEEP = '#2a1a10';
const DISPLAY = "700 %spx 'Fredoka'", BODY = "900 %spx 'Nunito'", MONO = "500 %spx 'DM Mono'";
const font = (f, px) => f.replace('%s', px);

// ---- math ---------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, u) => a + (b - a) * u;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOutExpo = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const eInExpo = (u) => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10));
const eInOutExpo = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2);
const eOutCubic = (u) => 1 - Math.pow(1 - u, 3);
const eInOutCubic = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
const eOutBack = (u, s = 1.7) => 1 + (s + 1) * Math.pow(u - 1, 3) + s * Math.pow(u - 1, 2);
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---- plates -------------------------------------------------------------------------------
let COUNTS = {};
const cache = new Map();
let used = new Set();
function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load ' + src)); im.src = src; });
}
// clip start times (global seconds at which the clip's local t = 0)
const START = {
  hero: 1.85, spring: 6, summer: 6, fall: 6, winter: 6,
  'tod-1': 9.6, 'tod-2': 9.6, 'tod-3': 9.6, 'tod-4': 9.6,
  water: 13.8, crops: 14.8, pop: 15.8, harvest: 16.8,
  beach: 17.7, reel: 18.7, storm: 19.7, snow: 20.7,
  forestnight: 22, rainbow: 22, housenight: 22, fog: 22, beachnight: 22, towneve: 22, forestfall: 22,
  festival: 22,
};
async function plate(id, t, startOverride) {
  const n = COUNTS[id];
  if (!n) throw new Error('no plate ' + id);
  const s = startOverride ?? START[id];
  const idx = clamp(Math.round((t - s) * FPS), 0, n - 1);
  const key = `${id}/${String(idx).padStart(4, '0')}`;
  used.add(key);
  if (!cache.has(key)) cache.set(key, loadImg(`/shots/reel/plates/${key}.jpg`));
  return cache.get(key);
}
function drawCover(img, { scale = 1, ox = 0, oy = 0, cx = W / 2, cy = H / 2, alpha = 1 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx + ox, cy + oy);
  ctx.scale(scale, scale);
  ctx.drawImage(img, -W / 2, -H / 2, W, H);
  ctx.restore();
}
// horizontal motion blur: average N copies across the shutter span
function drawBlurX(img, x, span, scale = 1) {
  const n = span < 2 ? 1 : Math.min(14, Math.ceil(span / 14) + 2);
  for (let i = 0; i < n; i++) {
    ctx.save();
    ctx.globalAlpha = i === 0 ? 1 : 1 / (i + 1);
    const o = n === 1 ? 0 : (i / (n - 1) - 0.5) * span;
    drawCover(img, { ox: x + o, scale });
    ctx.restore();
  }
}

// ---- text helpers -------------------------------------------------------------------------
function spacedWidth(text, ls) {
  let w = 0;
  for (const ch of text) w += ctx.measureText(ch).width + ls;
  return w - ls;
}
/**
 * Per-letter masked rise. p(i) gives each letter's 0..1 progress (in), q(i) its exit progress.
 * align: 'center' | 'left'. Mask band = [y - size, y + size*0.3].
 */
function riseText(text, x, y, size, f, { ls = 0, p = () => 1, q = () => 0, fill = CREAM, align = 'center', shadow = null, mask = true, dy = 1.05 } = {}) {
  ctx.save();
  ctx.font = font(f, size);
  ctx.textBaseline = 'alphabetic';
  const w = spacedWidth(text, ls);
  let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  if (mask) {
    ctx.beginPath();
    ctx.rect(cx - size, y - size * 1.08, w + size * 2, size * 1.42);
    ctx.clip();
  }
  let i = 0;
  for (const ch of text) {
    const cw = ctx.measureText(ch).width;
    const a = eOutExpo(clamp(p(i))), b = eInExpo(clamp(q(i)));
    const off = (1 - a) * size * dy - b * size * dy;
    if (a > 0 && b < 1) {
      ctx.save();
      if (shadow) { ctx.shadowColor = shadow[0]; ctx.shadowBlur = shadow[1]; ctx.shadowOffsetY = shadow[2] ?? 0; }
      ctx.fillStyle = fill;
      ctx.fillText(ch, cx, y + off);
      ctx.restore();
    }
    cx += cw + ls;
    i++;
  }
  ctx.restore();
  return w;
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---- global overlays ----------------------------------------------------------------------
const grain = [];
function makeGrain() {
  for (let k = 0; k < 6; k++) {
    const c = document.createElement('canvas');
    c.width = c.height = 384;
    const g = c.getContext('2d');
    const im = g.createImageData(384, 384);
    for (let i = 0; i < im.data.length; i += 4) {
      const v = hash(i * 0.37 + k * 1013.1) * 255;
      im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
      im.data[i + 3] = 255;
    }
    g.putImageData(im, 0, 0);
    grain.push(c);
  }
}
function drawGrain(f, amt = 0.07) {
  ctx.save();
  ctx.globalAlpha = amt;
  ctx.globalCompositeOperation = 'overlay';
  ctx.fillStyle = ctx.createPattern(grain[f % grain.length], 'repeat');
  ctx.translate((f * 97) % 384, (f * 57) % 384);
  ctx.fillRect(-384, -384, W + 384, H + 384);
  ctx.restore();
}
function vignette(a = 0.45) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(10,6,3,0)');
  g.addColorStop(1, `rgba(10,6,3,${a})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}
function flash(a, color = '255,247,230') {
  if (a <= 0) return;
  ctx.fillStyle = `rgba(${color},${clamp(a)})`;
  ctx.fillRect(0, 0, W, H);
}
function letterbox(h) {
  if (h <= 0) return;
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, W, h);
  ctx.fillRect(0, H - h, W, h);
}

const SECTIONS = [
  [2.0, '01', 'THE FARM'],
  [6.0, '02', 'FOUR SEASONS'],
  [10.0, '03', 'DAWN TO DUSK'],
  [14.0, '04', "A DAY'S WORK"],
  [18.0, '05', 'BEYOND THE FENCE'],
  [22.0, '06', 'THE VALLEY'],
];
function hud(t) {
  const a = prog(t, 2.3, 2.8) * (1 - prog(t, 25.6, 26.0));
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 12;
  // top-left mark
  ctx.font = font(MONO, 17);
  ctx.letterSpacing = '4px';
  ctx.fillStyle = CREAM;
  ctx.textBaseline = 'middle';
  ctx.fillText('HEARTHVALE', 64, 58);
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.arc(214, 58, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,243,220,0.7)';
  ctx.fillText('MOTION REEL', 228, 58);
  // top-right timecode
  const f = Math.floor(t * FPS);
  const tc = `00:00:${String(Math.floor(t)).padStart(2, '0')}:${String(f % FPS).padStart(2, '0')}`;
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(255,243,220,0.8)';
  ctx.fillText(tc, W - 64, 58);
  ctx.fillStyle = hash(Math.floor(t * 2)) > -1 && Math.floor(t * 2) % 2 ? EMBER : 'rgba(255,138,61,0.35)';
  ctx.beginPath(); ctx.arc(W - 64 - ctx.measureText(tc).width - 22, 58, 5, 0, Math.PI * 2); ctx.fill();
  ctx.textAlign = 'left';
  ctx.restore();

  // bottom-left section label, masked swap
  let cur = 0;
  for (let i = 0; i < SECTIONS.length; i++) if (t >= SECTIONS[i][0]) cur = i;
  const [st, num, name] = SECTIONS[cur];
  const pin = prog(t, st + 0.05, st + 0.6);
  const next = SECTIONS[cur + 1];
  const pout = next ? prog(t, next[0] - 0.3, next[0] - 0.02) : prog(t, 25.3, 25.7);
  ctx.save();
  ctx.globalAlpha = a;
  const y = H - 64;
  ctx.strokeStyle = GOLD;
  ctx.lineWidth = 2;
  const lw = 56 * eOutExpo(pin) * (1 - eInExpo(pout));
  ctx.beginPath(); ctx.moveTo(64, y - 9); ctx.lineTo(64 + lw, y - 9); ctx.stroke();
  riseText(num, 136, y, 22, MONO, { ls: 3, align: 'left', fill: GOLD, p: (i) => (pin - i * 0.08) * 1.4, q: () => pout, shadow: ['rgba(0,0,0,.5)', 10] });
  riseText(name, 180, y, 22, MONO, { ls: 5, align: 'left', fill: CREAM, p: (i) => (pin - 0.1 - i * 0.025) * 1.6, q: (i) => pout * 1.3 - i * 0.01, shadow: ['rgba(0,0,0,.5)', 10] });
  ctx.restore();
}

// ---- particles ------------------------------------------------------------------------------
function embers(t, count, alpha, { y0 = H + 40, spread = 1500, cx = W / 2, speed = 1 } = {}) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < count; i++) {
    const sp = (60 + hash(i) * 140) * speed;
    const life = 1300;
    const yy = y0 - ((t * sp + hash(i + 50) * life) % life);
    const xx = cx + (hash(i + 7) - 0.5) * spread + Math.sin(t * (0.6 + hash(i + 3)) + i) * 30;
    const r = 1.2 + hash(i + 9) * 3;
    const fl = 0.55 + 0.45 * Math.sin(t * 9 + i * 3.1);
    const g = ctx.createRadialGradient(xx, yy, 0, xx, yy, r * 5);
    g.addColorStop(0, `rgba(255,214,140,${alpha * fl})`);
    g.addColorStop(0.3, `rgba(255,150,60,${alpha * fl * 0.5})`);
    g.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = g;
    ctx.fillRect(xx - r * 5, yy - r * 5, r * 10, r * 10);
  }
  ctx.restore();
}
function burst(t, t0, x, y, n = 70) {
  const u = t - t0;
  if (u < 0 || u > 2.2) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const ang = hash(i + 200) * Math.PI * 2;
    const v = 300 + hash(i + 300) * 900;
    const drag = (1 - Math.exp(-u * 2.6)) / 2.6;
    const px = x + Math.cos(ang) * v * drag;
    const py = y + Math.sin(ang) * v * drag * 0.8 + 90 * u * u;
    const life = clamp(1 - u / (0.9 + hash(i + 400) * 1.3));
    const r = (1.5 + hash(i + 500) * 3.5) * life;
    if (r <= 0) continue;
    ctx.fillStyle = `rgba(255,${190 + hash(i) * 60 | 0},${110 + hash(i + 1) * 80 | 0},${life})`;
    ctx.shadowColor = 'rgba(255,170,70,0.9)';
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---- S0: ignite (0–2) -------------------------------------------------------------------------
const WORDS = ['PLANT', 'GROW', 'GATHER', 'BELONG'];
function wordLayout(k) {
  ctx.font = font(DISPLAY, 190);
  ctx.letterSpacing = '0px';
  const w = spacedWidth(WORDS[k], 6);
  const dot = 34;
  const total = w + 22 + dot;
  return { x: W / 2 - total / 2, w, dotX: W / 2 - total / 2 + w + 22 + dot / 2, dotY: 540 + 58 - dot / 2 - 4 };
}
function ignite(t) {
  ctx.fillStyle = INK;
  ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 900);
  glow.addColorStop(0, `rgba(120,60,20,${0.35 + 0.15 * prog(t, 0, 2)})`);
  glow.addColorStop(1, 'rgba(20,13,8,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);
  embers(t, 46, 0.55 * prog(t, 0, 0.6), { speed: 0.8 });
  const k = Math.min(3, Math.floor(t / 0.5));
  const lt = t - k * 0.5;
  const L = wordLayout(k);
  // rings from each word's ember
  for (let j = 0; j <= k; j++) {
    const u = (t - j * 0.5) / 1.1;
    if (u < 0 || u > 1) continue;
    const Lj = wordLayout(j);
    ctx.save();
    ctx.strokeStyle = `rgba(246,185,74,${(1 - u) * 0.8})`;
    ctx.lineWidth = 1 + 3 * (1 - u);
    ctx.beginPath(); ctx.arc(Lj.dotX, Lj.dotY, 20 + eOutExpo(u) * 900, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  const last = k === 3;
  const pin = lt / 0.2;
  const qout = last ? prog(t, 1.72, 1.95) * 1.2 : (lt - 0.36) / 0.13;
  riseText(WORDS[k], L.x, 598, 190, DISPLAY, {
    ls: 6, align: 'left', fill: CREAM,
    p: (i) => pin * 1.1 - i * 0.07,
    q: (i) => qout - (last ? (WORDS[k].length - 1 - i) * 0.08 : i * 0.05),
    shadow: ['rgba(255,140,60,0.25)', 40],
  });
  // the ember "full stop"
  const pop = eOutBack(clamp((lt - 0.08) / 0.22), 3);
  let r = 17 * pop * (1 + 0.08 * Math.sin(t * 30));
  if (last) r *= 1 + 0.6 * eInExpo(prog(t, 1.6, 1.95));
  if (r > 0) {
    ctx.save();
    ctx.shadowColor = 'rgba(255,170,60,1)';
    ctx.shadowBlur = 50 + 40 * (last ? prog(t, 1.5, 2) : 0);
    const g = ctx.createRadialGradient(L.dotX - 4, L.dotY - 4, 0, L.dotX, L.dotY, r);
    g.addColorStop(0, '#fff6d8'); g.addColorStop(0.5, GOLD); g.addColorStop(1, EMBER);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(L.dotX, L.dotY, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ---- S1: hero (1.85–6) ------------------------------------------------------------------------
async function hero(t) {
  const L = wordLayout(3);
  const u = prog(t, 1.85, 2.65);
  const R = eInOutExpo(u) * 2300 + 17;
  if (t < 2.65) {
    ignite(t);
    ctx.save();
    ctx.beginPath(); ctx.arc(L.dotX, L.dotY, R, 0, Math.PI * 2); ctx.clip();
    drawCover(await plate('hero', t), { scale: 1.25 - 0.25 * eOutExpo(u) });
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = GOLD; ctx.lineWidth = 6 * (1 - u) + 1;
    ctx.shadowColor = EMBER; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(L.dotX, L.dotY, R, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  } else {
    drawCover(await plate('hero', t));
  }
  // title scrim
  const sa = prog(t, 2.3, 3.0) * (1 - prog(t, 5.3, 5.9));
  if (sa > 0) {
    const g = ctx.createRadialGradient(W / 2, 520, 50, W / 2, 520, 900);
    g.addColorStop(0, `rgba(20,10,4,${0.5 * sa})`);
    g.addColorStop(1, 'rgba(20,10,4,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const s0 = 2.4;
  riseText('HEARTHVALE', W / 2, 560, 216, DISPLAY, {
    ls: 4 + 30 * (1 - eOutExpo(prog(t, s0, 4.2))),
    p: (i) => (t - s0 - i * 0.05) / 0.7,
    q: (i) => (t - 5.25 - i * 0.03) / 0.35,
    shadow: ['rgba(30,14,4,0.55)', 36, 8],
  });
  // gold rule
  const rw = 560 * eOutExpo(prog(t, 3.0, 3.8)) * (1 - eInExpo(prog(t, 5.3, 5.7)));
  if (rw > 1) {
    ctx.save();
    ctx.fillStyle = GOLD; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 10;
    ctx.fillRect(W / 2 - rw / 2, 612, rw, 4);
    ctx.beginPath(); ctx.arc(W / 2, 614, 8 * (rw / 560), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  const sub = prog(t, 3.25, 4.1) * (1 - prog(t, 5.2, 5.5));
  if (sub > 0) {
    ctx.save();
    ctx.globalAlpha = eOutCubic(sub);
    ctx.font = font(BODY, 27);
    ctx.letterSpacing = `${lerp(26, 11, eOutExpo(sub))}px`;
    ctx.textAlign = 'center';
    ctx.fillStyle = CREAM;
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 14;
    ctx.fillText('A COZY FARMING LIFE · HANDCRAFTED IN THREE.JS', W / 2, 676);
    ctx.restore();
  }
  letterbox(78 * eOutExpo(prog(t, 2.2, 2.9)) * (1 - eInOutExpo(prog(t, 5.6, 6.1))));
}

// ---- S2: seasons (6–10) -----------------------------------------------------------------------
const SEASONS = [
  { id: 'spring', name: 'SPRING', c: '#ffb3c7' },
  { id: 'summer', name: 'SUMMER', c: '#ffd24a' },
  { id: 'fall', name: 'AUTUMN', c: '#ff8a3d' },
  { id: 'winter', name: 'WINTER', c: '#bfe6ff' },
];
const SK = 170; // slice lean in px
function slicePoly(x0, x1, dy) {
  ctx.beginPath();
  ctx.moveTo(x0 + SK / 2, dy);
  ctx.lineTo(x1 + SK / 2, dy);
  ctx.lineTo(x1 - SK / 2, H + dy);
  ctx.lineTo(x0 - SK / 2, H + dy);
  ctx.closePath();
}
function glyph(kind, x, y, s, color, p) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * eOutBack(clamp(p), 2.2), s * eOutBack(clamp(p), 2.2));
  ctx.rotate((1 - eOutExpo(clamp(p))) * -1.2);
  ctx.fillStyle = color; ctx.strokeStyle = color; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 8;
  if (kind === 0) { // blossom
    for (let i = 0; i < 5; i++) { ctx.save(); ctx.rotate((i * Math.PI * 2) / 5); ctx.beginPath(); ctx.ellipse(0, -9, 6, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
    ctx.fillStyle = '#fff3dc'; ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
  } else if (kind === 1) { // sun
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.lineTo(Math.cos(a) * 19, Math.sin(a) * 19); ctx.stroke(); }
  } else if (kind === 2) { // leaf
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.quadraticCurveTo(16, -4, 0, 16); ctx.quadraticCurveTo(-16, -4, 0, -18); ctx.fill();
    ctx.strokeStyle = 'rgba(40,20,5,.6)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(0, 20); ctx.stroke();
  } else { // snowflake
    for (let i = 0; i < 6; i++) { ctx.save(); ctx.rotate((i * Math.PI) / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -18); ctx.moveTo(0, -10); ctx.lineTo(-5, -15); ctx.moveTo(0, -10); ctx.lineTo(5, -15); ctx.stroke(); ctx.restore(); }
  }
  ctx.restore();
}
async function seasons(t) {
  // what's underneath before the slices cover it
  if (t < 7.2) drawCover(await plate('hero', t));
  const push = 1 + 0.05 * eInOutCubic(prog(t, 6.5, 10));
  // collapse: winter's left edge sweeps to the left, covering the rest
  const col = eInOutExpo(prog(t, 8.85, 9.55));
  for (let k = 0; k < 4; k++) {
    const te = 6 + k * 0.5 - 0.12;
    const e = eOutExpo(prog(t, te, te + 0.62));
    if (e <= 0) continue;
    const dir = k % 2 ? -1 : 1;
    const dy = (1 - e) * H * 1.15 * dir;
    let x0 = k === 0 ? -300 : k * 480;
    let x1 = k === 3 ? W + 300 : (k + 1) * 480;
    if (k === 3) x0 = lerp(x0, -400, col);
    ctx.save();
    slicePoly(x0, x1, dy);
    ctx.clip();
    drawCover(await plate(SEASONS[k].id, t), { oy: dy * 0.6, scale: push });
    // color kiss at the entry
    ctx.fillStyle = SEASONS[k].c;
    ctx.globalAlpha = 0.45 * (1 - eOutCubic(prog(t, te, te + 0.4)));
    ctx.fillRect(-400, -200, W + 800, H + 400);
    ctx.restore();
    // seam
    if (k > 0 && e > 0) {
      ctx.save();

// ---- S3: time of day (10–14) ------------------------------------------------------------------
const TOD = [

  grad.addColorStop(0, '#fff7e4'); grad.addColorStop(1, '#f6c46a');
  riseText('HEARTHVALE', W / 2, 628, 196, DISPLAY, {
    ls: 6 + 18 * (1 - eOutExpo(prog(t, s0, 28))),
    fill: grad, mask: true,
    p: (i) => (t - s0 - Math.abs(i - 4.5) * 0.045) / 0.75,
    shadow: ['rgba(255,150,60,0.45)', 50],
  });
  ctx.restore();
  // tagline typewriter
  const tag = 'Relight the valley.';
  const n = Math.floor(clamp(prog(t, 27.15, 27.95)) * tag.length);
  ctx.save();
  ctx.font = font(BODY, 44); ctx.letterSpacing = '3px';
  ctx.textAlign = 'left'; ctx.fillStyle = CREAM;
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 16;
  const full = ctx.measureText(tag).width;
  const shown = tag.slice(0, n);
  ctx.fillText(shown, W / 2 - full / 2, 722);
  if (t > 27.05 && Math.floor(t * 3) % 2 === 0) {
    ctx.fillStyle = GOLD;
    ctx.fillRect(W / 2 - full / 2 + ctx.measureText(shown).width + 6, 688, 4, 44);
  }
  ctx.restore();
  const ca = prog(t, 28.0, 28.5);
  if (ca > 0) {
    ctx.save();
    ctx.globalAlpha = ca * 0.75;
    ctx.font = font(MONO, 19); ctx.letterSpacing = '6px'; ctx.textAlign = 'center'; ctx.fillStyle = CREAM;
    ctx.fillText('100% REAL-TIME FOOTAGE · CAPTURED IN-ENGINE · THREE.JS', W / 2, H - 110);
    ctx.restore();
  }
  letterbox(78 * eOutExpo(prog(t, 26.0, 26.6)));
  flash(0.85 * (1 - prog(t, 26, 26.22)));
  // fade out
  ctx.fillStyle = `rgba(0,0,0,${eInOutCubic(prog(t, 29.25, 30))})`;
  ctx.fillRect(0, 0, W, H);
}

// ---- master -------------------------------------------------------------------------------
window.renderFrame = async function (f) {
  const t = f / FPS;
  used = new Set();
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.letterSpacing = '0px';
  if (t < 1.85) ignite(t);
  else if (t < 6.0) await hero(t);
  else if (t < 9.75) await seasons(t);
  else if (t < 14.0) await timeOfDay(t);
  else if (t < 18 - WHIP / 2) await farming(t);
  else if (t < 22.0) await tour(t);
  else if (t < 26.0) await mosaic(t);
  else await endCard(t);
  ctx.restore();
  ctx.letterSpacing = '0px';
  if (t < 26 || t > 26.1) vignette(t < 2 ? 0.2 : 0.42);
  hud(t);
  drawGrain(f, 0.075);
  // evict frames not needed any more
  for (const k of cache.keys()) if (!used.has(k)) cache.delete(k);
};
window.boot = async function (counts) {
  COUNTS = counts;
  makeGrain();
  await Promise.all([
    document.fonts.load(font(DISPLAY, 100)), document.fonts.load(font(BODY, 30)), document.fonts.load(font(MONO, 20)),
  ]);
  return document.fonts.check(font(DISPLAY, 100));
};
